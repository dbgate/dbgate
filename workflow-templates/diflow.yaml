name: Diflow merge

on:
  push:
    branches:
      - master

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js 22.x
        uses: actions/setup-node@v1
        with:
          node-version: 22.x

      - name: Diflow install
        run: npm install -g diflow

      - name: Git config
        run: |
          git config --global user.email "info@dbgate.io"
          git config --global user.name "Diflow"          

      - name: Diflow run
        run: diflow sync -r https://DIFLOW_GIT_SECRET@github.com/dbgate/dbgate-diflow-config.git -b master
        env:
          DIFLOW_GIT_SECRET: '${{ secrets.DIFLOW_GIT_SECRET }}'

