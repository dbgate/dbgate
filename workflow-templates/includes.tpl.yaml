_module: true

checkout-and-merge-pro:
  - name: Checkout dbgate/dbgate-pro
    uses: actions/checkout@v2
    with:
      repository: dbgate/dbgate-pro
      token: ${{ secrets.GH_TOKEN }}
      path: dbgate-pro
      ref: be3354f33642a3c205f5e01dc87d5dc0acadc405
  - name: Diflow install
    run: npm install -g diflow
  - name: Merge dbgate/dbgate-pro
    shell: bash
    run: |
      mkdir ../dbgate-pro
      mv dbgate-pro/* ../dbgate-pro/
      rm -rf dbgate-pro
      diflow fsmerge -b . -d ../dbgate-pro -m ../dbgate-merged
